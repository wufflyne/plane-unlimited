# plane-unlimited: RabbitMQ 4.x deprecated-queues permission.
# Plane (silo / live-exporter) declares transient non-exclusive classic
# queues; RabbitMQ >= 4.1 refuses them by default, which crashed silo and
# live-exporter in a reconnect loop. Permit the deprecated feature.
# Author: wufflyne <wufflyne@proton.me> — wufflyne.com
deprecated_features.permit.transient_nonexcl_queues = true
